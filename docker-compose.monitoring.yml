version: "3.9"

services:
  webhook-catcher:
    build:
      context: ./Py
      dockerfile: Dockerfile
    container_name: superapp-webhook-catcher
    environment:
      ALERT_NOTIFIER_MODE: ${ALERT_NOTIFIER_MODE:-log}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      ALERT_DEAD_LETTER_FILE: /data/dead-letter.jsonl
    ports:
      - "5001:5001"
    volumes:
      - webhook_data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: superapp-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:11.2.0
    container_name: superapp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: superapp-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      - webhook-catcher

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  webhook_data:
