spring:
  application:
    name: superapp-be
  datasource:
    url: jdbc:h2:mem:superapp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: superapp-be

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:superapp-portfolio-dev-secret-must-change}
    jwt-expiration-seconds: ${APP_AUTH_JWT_EXPIRATION_SECONDS:86400}
    refresh-expiration-seconds: ${APP_AUTH_REFRESH_EXPIRATION_SECONDS:2592000}
    crypto-key-base64: ${APP_AUTH_CRYPTO_KEY_BASE64:}
    session-prune-delay-ms: ${APP_AUTH_SESSION_PRUNE_DELAY_MS:3600000}
    mfa:
      challenge-store: ${APP_AUTH_MFA_CHALLENGE_STORE:memory}
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}
