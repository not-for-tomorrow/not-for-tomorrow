groups:
  - name: superapp-be-alerts
    rules:
      - alert: SuperAppBackendDown
        expr: up{job="superapp-be"} == 0
        for: 2m
        labels:
          severity: critical
          service: superapp-be
        annotations:
          summary: "SuperApp backend is down"
          description: "Prometheus cannot scrape superapp-be for more than 2 minutes."

      - alert: SuperAppHighHttpErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{application="superapp-be",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{application="superapp-be"}[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: superapp-be
        annotations:
          summary: "High HTTP 5xx rate on superapp-be"
          description: "5xx ratio has exceeded 5% for at least 5 minutes."

      - alert: SuperAppHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket{application="superapp-be"}[5m])) by (le)
          ) > 1.2
        for: 5m
        labels:
          severity: warning
          service: superapp-be
        annotations:
          summary: "High p95 latency on superapp-be"
          description: "p95 latency is above 1.2s for at least 5 minutes."
